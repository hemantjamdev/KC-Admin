<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        }

            border: none;
            border-bottom: 1.5px solid #DCE4DF;

            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-underline:focus {
            outline: none;
            box-shadow: none;
            border-color: #003a26;
        }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- Top Navigation Bar (Back/Title) -->
<header class="sticky top-0 z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant/30 flex justify-between items-center px-margin-mobile py-4 md:px-margin-desktop">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 hover:opacity-70 transition-opacity" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary">Add Product</h1>
</div>
<button class="font-label-md text-label-md text-primary hover:opacity-70 transition-opacity">
            Preview
        </button>
</header>
<main class="max-w-[800px] mx-auto px-margin-mobile py-8 md:px-0 mb-32">
<form class="space-y-12">
<!-- Image Upload Section -->
<section>
<div class="flex flex-col gap-4">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Garment Photography</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<!-- Main Upload Placeholder -->
<div class="col-span-2 md:col-span-2 aspect-[3/4] stitch-border rounded-xl flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer relative group">
<span class="material-symbols-outlined text-4xl text-primary mb-2">add_a_photo</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Upload Hero Image</span>
<!-- Progress Bar Mockup -->
<div class="absolute bottom-4 left-4 right-4 h-1 bg-outline-variant/20 rounded-full overflow-hidden opacity-0 group-hover:opacity-100 transition-opacity">
<div class="h-full bg-primary w-1/3"></div>
</div>
</div>
<!-- Secondary Uploads -->
<div class="aspect-[3/4] border border-outline-variant/40 rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined text-2xl text-on-surface-variant">image</span>
</div>
<div class="aspect-[3/4] border border-outline-variant/40 rounded-xl flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined text-2xl text-on-surface-variant">photo_library</span>
</div>
</div>
</div>
</section>
<!-- Basic Details -->
<section class="space-y-8">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Title -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="product_title">Product Title</label>
<input class="input-underline font-headline-md text-headline-md text-primary py-3" id="product_title" placeholder="e.g., Mehreen Anarkali Set" type="text" value="Mehreen Anarkali Set"/>
</div>
<!-- Price -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="product_price">Price (INR)</label>
<div class="relative">
<span class="absolute left-0 bottom-3 font-headline-md text-primary">₹</span>
<input class="input-underline font-headline-md text-headline-md text-primary py-3 pl-8 w-full" id="product_price" placeholder="4,500" type="text"/>
</div>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest" for="product_desc">Artisan's Note (Description)</label>
<textarea class="input-underline font-body-md text-body-md text-on-surface py-3 resize-none" id="product_desc" placeholder="Describe the craftsmanship, fabric details, and styling advice..." rows="3"></textarea>
</div>
</section>
<!-- Color Palette Selection -->
<section>
<div class="flex flex-col gap-6">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Color Palette</label>
<div class="flex flex-wrap gap-4">
<!-- Swatches -->
<button class="w-12 h-12 rounded-full border-2 border-primary p-0.5 bg-background transition-transform active:scale-95" type="button">
<div class="w-full h-full rounded-full bg-[#18523a]"></div>
</button>
<button class="w-12 h-12 rounded-full border-2 border-transparent hover:border-outline-variant/40 p-0.5 bg-background transition-transform active:scale-95" type="button">
<div class="w-full h-full rounded-full bg-[#F7F1E7]"></div>
</button>
<button class="w-12 h-12 rounded-full border-2 border-transparent hover:border-outline-variant/40 p-0.5 bg-background transition-transform active:scale-95" type="button">
<div class="w-full h-full rounded-full bg-[#D4AF37]"></div>
</button>
<button class="w-12 h-12 rounded-full border-2 border-transparent hover:border-outline-variant/40 p-0.5 bg-background transition-transform active:scale-95" type="button">
<div class="w-full h-full rounded-full bg-[#800020]"></div>
</button>
<button class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-on-surface-variant">add</span>
</button>
</div>
</div>
</section>
<!-- Fixed Sizes Selection -->
<section>
<div class="flex flex-col gap-6">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Tailored Sizes</label>
<div class="grid grid-cols-4 md:grid-cols-8 gap-3">
<!-- Size Chips -->
<div class="cursor-pointer">
<input class="hidden peer" id="size-xs" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-xs">XS</label>
</div>
<div class="cursor-pointer">
<input checked="" class="hidden peer" id="size-s" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-s">S</label>
</div>
<div class="cursor-pointer">
<input checked="" class="hidden peer" id="size-m" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-m">M</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="size-l" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-l">L</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="size-xl" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-xl">XL</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="size-2xl" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-2xl">2XL</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="size-3xl" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-3xl">3XL</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="size-4xl" type="checkbox"/>
<label class="flex items-center justify-center h-12 rounded-lg border border-outline-variant font-label-md peer-checked:bg-primary peer-checked:text-white peer-checked:border-primary transition-all" for="size-4xl">4XL</label>
</div>
</div>
</div>
</section>
<!-- Section Assignment -->
<section>
<div class="flex flex-col gap-6">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Section Assignment</label>
<div class="flex flex-wrap gap-4">
<!-- Section Chips -->
<div class="cursor-pointer">
<input class="hidden peer" id="sec-trending" type="checkbox"/>
<label class="px-6 py-2 rounded-full border border-outline-variant font-label-md peer-checked:bg-secondary-container peer-checked:border-secondary-container transition-all" for="sec-trending">Trending</label>
</div>
<div class="cursor-pointer">
<input checked="" class="hidden peer" id="sec-new" type="checkbox"/>
<label class="px-6 py-2 rounded-full border border-outline-variant font-label-md peer-checked:bg-secondary-container peer-checked:border-secondary-container transition-all" for="sec-new">New Arrivals</label>
</div>
<div class="cursor-pointer">
<input checked="" class="hidden peer" id="sec-festival" type="checkbox"/>
<label class="px-6 py-2 rounded-full border border-outline-variant font-label-md peer-checked:bg-secondary-container peer-checked:border-secondary-container transition-all" for="sec-festival">Festival</label>
</div>
<div class="cursor-pointer">
<input class="hidden peer" id="sec-seasonal" type="checkbox"/>
<label class="px-6 py-2 rounded-full border border-outline-variant font-label-md peer-checked:bg-secondary-container peer-checked:border-secondary-container transition-all" for="sec-seasonal">Seasonal</label>
</div>
</div>
</div>
</section>
<!-- Availability Toggle -->
<section class="pb-12">
<div class="flex items-center justify-between p-6 bg-surface-container-low rounded-2xl border border-outline-variant/30">
<div class="flex flex-col">
<span class="font-label-md text-primary uppercase tracking-widest">Availability</span>
<span class="font-body-md text-on-surface-variant" id="stock-status">Currently Available for Order</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" onchange="document.getElementById('stock-status').innerText = this.checked ? 'Currently Available for Order' : 'Marked as Out of Stock'" type="checkbox" value=""/>
<div class="w-14 h-8 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
</form>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-xl border-t border-outline-variant/30 px-margin-mobile py-6 z-50">
<div class="max-w-[800px] mx-auto flex flex-col md:flex-row gap-4">
<button class="flex-1 border border-primary text-primary font-label-md text-label-md px-8 py-4 rounded-lg hover:bg-surface-container-low transition-colors active:scale-95">
                Save Draft
            </button>
<button class="flex-2 md:flex-[2] bg-primary text-white font-label-md text-label-md px-12 py-4 rounded-lg shadow-lg hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">publish</span>
                Publish Product
            </button>
</div>
</footer>
<!-- Decorative Micro-Interaction Script -->
<script>
        // Simple input highlight interaction
        const inputs = document.querySelectorAll('.input-underline');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            });
        });

        // Dynamic pricing formatter (Visual only)
        const priceInput = document.getElementById('product_price');
        priceInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, "");
            if(value) {
                value = parseInt(value, 10).toLocaleString('en-IN');
                e.target.value = value;
            }
        });
    </script>
</body></html>
